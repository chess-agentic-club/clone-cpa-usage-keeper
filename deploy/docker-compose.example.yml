# Copy this file to the repository root before running `docker compose up`.
# Keeper is built from that checkout; CPA_USAGE_KEEPER_IMAGE only sets its local tag.
services:
  cpa-usage-keeper:
    build:
      context: .
      dockerfile: Dockerfile
    # Optional local tag; the image is always built from this checkout.
    image: ${CPA_USAGE_KEEPER_IMAGE:-cpa-usage-keeper:local}
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data

